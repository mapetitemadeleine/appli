<script type="text/babel" src="app/mpm-app.jsx?v=20260904b"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<window.App />);
const voile = document.getElementById('demarrage');
setTimeout(()=>{ voile.style.opacity = 0; setTimeout(()=>voile.remove(), 450); }, 700);
const autonome = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
if (iOS && !autonome && !localStorage.getItem('mpm-ajout-vu')) {
  setTimeout(()=>{ document.getElementById('ajout').style.display = 'flex'; }, 2600);
}
document.getElementById('ajout-ok').onclick = () => { localStorage.setItem('mpm-ajout-vu','1'); document.getElementById('ajout').style.display = 'none'; };
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      let recharge = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recharge) { recharge = true; location.reload(); } });
      const attendre = w => w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage('maintenant'); });
      attendre(reg.waiting); attendre(reg.installing);
      reg.addEventListener('updatefound', () => attendre(reg.installing));
      setInterval(() => reg.update().catch(()=>{}), 60 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(()=>{}); });
    } catch(e){}
  });
}
</script>
