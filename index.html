<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<window.App />);
const voile = document.getElementById('demarrage');
setTimeout(()=>{ voile.style.opacity = 0; setTimeout(()=>voile.remove(), 450); }, 700);
const autonome = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
if (iOS && !autonome && !localStorage.getItem('mpm-ajout-vu')) {
  setTimeout(()=>{ document.getElementById('ajout').style.display = 'flex'; }, 2600);
}
document.getElementById('ajout-ok').onclick = () => { localStorage.setItem('mpm-ajout-vu','1'); document.getElementById('ajout').style.display = 'none'; };
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      let recharge = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recharge) { recharge = true; location.reload(); } });
      const attendre = w => w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage('maintenant'); });
      attendre(reg.waiting); attendre(reg.installing);
      reg.addEventListener('updatefound', () => attendre(reg.installing));
      setInterval(() => reg.update().catch(()=>{}), 60 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(()=>{}); });
    } catch(e){}
  });
}
</script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "ambiance": "Jour",
  "lecture": "Grand",
  "cadre": "Plein écran"
}/*EDITMODE-END*/;

const PALETTES = {
  Soir: {
    '#FBF6EC':'#141F35','#FDFBF6':'#1A2742','#FFFFFF':'#1A2742','#F4EBD8':'#1E2C49',
    '#E6D9BC':'#33456B','#1C2B4F':'#F2E8D5','#141F3A':'#F2E8D5','#38507C':'#C6CEE2',
    '#7C8CAE':'#93A1BF','#8F6518':'#E0B463','#B8862B':'#E0B463','#D9AE5C':'#F0CE8A',
    '#F3E4C0':'#3A2F1A','#E7ECDF':'#22402F','#DCE2ED':'#22304C','#F1DEDC':'#3D2422',
    '#A8322F':'#E0736C','#C0443C':'#E0736C'
  },
  Gravure: {
    '#FBF6EC':'#F2EDE1','#FDFBF6':'#FAF7F0','#FFFFFF':'#FAF7F0','#F4EBD8':'#EAE3D2',
    '#E6D9BC':'#BFB49A','#1C2B4F':'#14161A','#141F3A':'#14161A','#38507C':'#3A3F49',
    '#7C8CAE':'#7B8189','#8F6518':'#6E5514','#B8862B':'#8A6A22','#D9AE5C':'#B9944A',
    '#F3E4C0':'#E3D9BF','#E7ECDF':'#DFE2D4','#DCE2ED':'#DDDCD6','#F1DEDC':'#E8DAD6'
  }
};
const ZOOMS = { 'Normal': 1, 'Grand': 1.12, 'Très grand': 1.26 };
const CADRES = { 'Téléphone': 'telephone', 'Tablette': 'tablette', 'Plein écran': 'plein' };

// Le fond des pages est peint en style en ligne par l'appli : on repeint au vol,
// en gardant la valeur d'origine de chaque élément pour pouvoir revenir au jour.
const memoire = new WeakMap();
let observateur = null;
const RE_COULEUR = /#[0-9a-f]{6}\b|rgba?\([^)]*\)/gi;

function cle(c) {
  c = String(c).trim().toLowerCase();
  if (c[0] === '#' && c.length >= 7) { const n = parseInt(c.slice(1, 7), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(','); }
  const m = c.match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  const p = m[1].split(/[,\s/]+/).filter(Boolean).map(parseFloat);
  return p.slice(0, 3).join(',');
}
function normaliser(table) {
  const sortie = {};
  for (const k in table) { const c = cle(k); if (c) sortie[c] = table[k]; }
  return sortie;
}
function versHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hsl(h, s, l) { return 'hsl(' + Math.round(h) + ', ' + Math.round(s * 100) + '%, ' + Math.round(l * 100) + '%)'; }
// Les teintes que la table ne connaît pas (fonds pastel calculés par l'appli) :
// on les retourne dans la nuit, on les assagit dans la gravure.
const SECOURS = {
  Soir: (r, g, b) => { const [h, s, l] = versHsl(r, g, b); return hsl(h, Math.min(s * 0.62, 0.45), Math.max(0.08, Math.min(0.92, 1 - l) * 0.34 + 0.06)); },
  Gravure: (r, g, b) => { const [h, s, l] = versHsl(r, g, b); return hsl(h, s * 0.4, l > 0.55 ? Math.min(0.96, l + 0.02) : l * 0.82); }
};

function teindre(texte, table, secours) {
  return texte.replace(RE_COULEUR, m => {
    const k = cle(m);
    let cible = table[k];
    if (!cible && secours && k) { const p = k.split(',').map(Number); cible = secours(p[0], p[1], p[2]); }
    if (!cible) return m;
    const alpha = m.match(/rgba\(([^)]+)\)/);
    if (alpha) {
      const p = alpha[1].split(/[,\s/]+/).filter(Boolean);
      if (p.length > 3 && cible[0] === '#') return 'rgba(' + cle(cible).split(',').join(', ') + ', ' + p[3] + ')';
      if (p.length > 3) return m;
    }
    return cible;
  });
}

function repeindre(palette, secours) {
  const racine = document.getElementById('root');
  if (!racine) return;
  if (observateur) observateur.disconnect();
  racine.querySelectorAll('[style]').forEach(el => {
    const actuel = el.getAttribute('style') || '';
    let fiche = memoire.get(el);
    if (!fiche || actuel !== fiche.sortie) { fiche = { origine: actuel, sortie: actuel }; memoire.set(el, fiche); }
    const voulu = palette ? teindre(fiche.origine, palette, secours) : fiche.origine;
    if (voulu !== actuel) el.setAttribute('style', voulu);
    fiche.sortie = voulu;
  });
  if (observateur) { observateur.takeRecords(); observateur.observe(racine, { subtree: true, childList: true, attributes: true, attributeFilter: ['style'] }); }
}

function MPMReglages() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const palette = PALETTES[t.ambiance] ? normaliser(PALETTES[t.ambiance]) : null;
  const secours = SECOURS[t.ambiance] || null;

  React.useEffect(() => {
    document.body.dataset.ambiance = palette ? t.ambiance.toLowerCase() : 'jour';
    const racine = document.getElementById('root');
    if (!racine) return;
    let attente = null;
    observateur = new MutationObserver(() => {
      if (attente) return;
      attente = requestAnimationFrame(() => { attente = null; repeindre(palette, secours); });
    });
    repeindre(palette, secours);
    return () => { if (attente) cancelAnimationFrame(attente); observateur.disconnect(); observateur = null; };
  }, [t.ambiance]);

  React.useEffect(() => {
    document.documentElement.style.setProperty('--mpm-zoom', ZOOMS[t.lecture] || 1);
  }, [t.lecture]);

  React.useEffect(() => {
    document.body.dataset.cadre = CADRES[t.cadre] || 'telephone';
  }, [t.cadre]);

  return (
    <TweaksPanel>
      <TweakSection label="L'ambiance" />
      <TweakRadio label="Le papier" value={t.ambiance} options={['Jour', 'Soir', 'Gravure']}
                  onChange={v => setTweak('ambiance', v)} />
      <TweakSection label="Le confort" />
      <TweakRadio label="Lecture" value={t.lecture} options={['Normal', 'Grand', 'Très grand']}
                  onChange={v => setTweak('lecture', v)} />
      <TweakSection label="Le cadre" />
      <TweakRadio label="Sur grand écran" value={t.cadre} options={['Téléphone', 'Tablette', 'Plein écran']}
                  onChange={v => setTweak('cadre', v)} />
    </TweaksPanel>
  );
}

ReactDOM.createRoot(document.getElementById('reglages')).render(<MPMReglages />);
</script>
